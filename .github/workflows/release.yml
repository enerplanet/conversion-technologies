name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install build
          python -m build
      # The JSON catalog is attached to the release for consumers that 
      # read the technology parameters instead of Calliope YAML.
      - name: Export the technology catalog
        run: |
          pip install dist/*.whl
          conversion-technologies export-json -o dist/technologies.json
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
